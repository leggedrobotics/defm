[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defm"
version = "1.1.0"
keywords = ["computer-vision", "foundation-model", "robotics"]
maintainers = [
  { name="Manthan Patel", email="patelm@ethz.ch" },
]
authors = [
  { name="Manthan Patel", email="patelm@ethz.ch" },
]
description = "DeFM: Learning Foundation Representations from Depth for Robotics"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "huggingface-hub>=0.36.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.7.5",
    "numpy<2.0.0",
    "omegaconf>=2.3.0",
    "opencv-python>=4.11.0.86",
    "pillow>=10.4.0",
    "scikit-learn>=1.3.2",
    "torch>=2.4.1",
    "torchvision>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/leggedrobotics/defm"
Issues = "https://github.com/leggedrobotics/defm/issues"

[project.optional-dependencies]
# Benchmarks (classification + segmentation, see benchmarks/README.md). Run them from the repository root.
# transformers is pinned below 5: Theia's remote code does not load with transformers 5.
benchmarks = [
    "transformers>=4.56,<5; python_version >= '3.9'",
    "safetensors",
    "timm",
    "einops",
    "pyarrow",
    "h5py",   # scripts/datasets/convert_sunrgbd.py --source official
    "scipy",
]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["defm*"]

[tool.setuptools.package-data]
"defm" = ["configs/*", "licenses/*"]
